[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neutral-atom-knowledge-base"
version = "0.2.0"
description = "Build and search a reproducible neutral-atom quantum-computing literature knowledge base."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
atlas = ["numpy>=1.26"]

[project.scripts]
neutral-atom-graph = "neutral_atom_graph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neutral_atom_graph*"]
